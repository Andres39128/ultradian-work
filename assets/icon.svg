<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="64" cy="64" r="56" fill="#1e1e2e" stroke="url(#grad)" stroke-width="4"/>
  
  <!-- Círculo interno -->
  <circle cx="64" cy="64" r="48" fill="#0f0f1a"/>
  
  <!-- Reloj -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#6366f1" stroke-width="3"/>
  
  <!-- Manecillas del reloj (representando ritmo) -->
  <line x1="64" y1="64" x2="64" y2="32" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="88" y2="64" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Ondas ultradianas -->
  <path d="M 28 64 Q 40 48 52 64 T 76 64 T 100 64" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Puntos de ciclo -->
  <circle cx="44" cy="56" r="3" fill="#8b5cf6"/>
  <circle cx="64" cy="64" r="3" fill="#8b5cf6"/>
  <circle cx="84" cy="72" r="3" fill="#8b5cf6"/>
</svg>
